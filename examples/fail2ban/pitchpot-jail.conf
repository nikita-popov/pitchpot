[pitchpot]
enabled   = true
filter    = pitchpot-filter
logpath   = /var/log/pitchpot/ban.log
maxretry  = 1
findtime  = 3600
bantime   = 86400
action    = iptables-multiport[name=pitchpot, port="http,https", protocol=tcp]

# For critical probes (AWS creds, SQL dumps, phpunit RCE):
# Lower maxretry to 1 and increase bantime to 604800 (7 days).
