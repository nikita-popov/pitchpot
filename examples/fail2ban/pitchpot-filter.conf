# Pitchpot ban-log filter for fail2ban.
# Log format (tab-separated):
#   <ts> <src_ip> <protocol> <stage> <risk> <labels> <detail>
#
# Match any request logged by pitchpot.
# Use failregex with a specific risk level to tune sensitivity.

# Match high or critical risk events.
failregex = ^\S+\t<HOST>\t\S+\t\S+\t(high|critical)\t

